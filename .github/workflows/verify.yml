name: Verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify site
        run: npm run build:verified

      - name: Deploy to Cloudflare Pages
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && github.repository == 'MuggleStudio/website'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.MUGGLESTUDIO_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.MUGGLESTUDIO_CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ -z "$main_sha" ]]; then
            echo '::error::Could not determine the current main commit.'
            exit 1
          fi
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo 'Skipping deployment because main has advanced.'
            exit 0
          fi

          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Configure MUGGLESTUDIO_PAGES_API_TOKEN and MUGGLESTUDIO_CLOUDFLARE_ACCOUNT_ID in Actions settings.'
            exit 1
          fi

          unset GH_TOKEN
          npx --yes wrangler@4.123.0 pages deploy dist --project-name mugglestudio --branch main --commit-hash "$GITHUB_SHA"
